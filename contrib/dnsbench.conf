# dnsbench configuration — /etc/dnsbench/dnsbench.conf
#
# systemd loads this file as the service's environment, so it is plain
# KEY=value lines: no quotes, no spaces around "=", no "export".
# After editing:  systemctl restart dnsbench

# Address and port for the web UI and API. Bind to a management address if you
# can: anyone who can sign in can generate DNS load from this host.
LISTEN_HOST=0.0.0.0
LISTEN_PORT=8453

# TLS. With both blank, dnsbench creates a self-signed certificate on first
# start and keeps it in STATE_DIR (your browser will warn about it once).
# To use your own, point these at PEM files; a renewed certificate is picked up
# within about ten seconds, with no restart.
TLS_CERT=
TLS_KEY=

# Serve plain HTTP instead (true/false). Passwords and session tokens then
# cross the network in clear text; use it only behind a TLS-terminating proxy.
NO_TLS=false

# Where dnsbench keeps its generated certificate and the saved schedules.
STATE_DIR=/var/lib/dnsbench

# Schedules file; blank means STATE_DIR/schedules.json.
SCHEDULES_FILE=

# PAM service used to check logins; blank means /etc/pam.d/dnsbench.
PAM_SERVICE=

# Only members of this group may sign in, on top of a correct password. The
# installer creates it and adds the user who ran the installer; add others with
#   usermod -aG dnsbench NAME
# Membership is checked at every sign-in, so changes apply at once. If you name
# a different group here (for example one from LDAP or SSSD), the installer
# leaves it alone and you manage its members. If the group does not exist,
# nobody can sign in. Blank means dnsbench.
LOGIN_GROUP=dnsbench
