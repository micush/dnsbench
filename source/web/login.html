<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="/theme.js"></script>
  <title>dns[bench] &middot; Login</title>
  <link rel="stylesheet" href="/ui.css">
  <style>
    [data-theme="dark"]{--body-bg:#353c42;--secondary-bg:#3f464d;--tertiary-bg:#485058}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-card{width:100%;max-width:420px}
    .brand-icon{font-size:4.225rem;color:#0d6efd}
  </style>
</head>
<body>
  <div class="login-card p-4">
    <div class="text-center mb-4">
      <div class="brand-icon"><i class="bi bi-speedometer2"></i></div>
      <h4 class="mt-2 fw-bold">dns[bench]</h4>
      <p class="text-muted small">DNS Benchmarking</p>
    </div>
    
    <form method="POST" action="/login">
      
      <div class="mb-3 ">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input name="username" type="text" class="form-control" placeholder="admin"
                 autofocus required value="">
        </div>
      </div>
      <div class="mb-3 ">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="password" type="password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i>
        Sign In
      </button>
      
    </form>
    <p class="text-center text-muted small mt-4">Sign in with your system account</p>
  </div>
  <button class="btn btn-sm btn-outline-secondary position-fixed top-0 end-0 m-3"
          onclick="toggleTheme()" data-theme-toggle title="Toggle theme">
    <i class="bi bi-circle-half"></i>
  </button>
</body>
</html>
